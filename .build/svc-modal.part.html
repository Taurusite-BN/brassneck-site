<dialog class="svc-modal" id="svc-modal">
    <form method="dialog" class="svc-modal-close-form">
      <button class="svc-close" value="close" aria-label="Close">&times;</button>
    </form>
    <p class="svc-modal-eyebrow" id="svc-modal-eyebrow">Prices and an example</p>
    <h2 class="svc-modal-title" id="svc-modal-title"></h2>
    <div id="svc-modal-prices"></div>
    <figure class="lap" id="svc-modal-lap">
      <div class="lap-screen">
        <img alt="" id="svc-modal-img">
        <video id="svc-modal-vid" muted loop playsinline preload="none" hidden></video>
        <span class="svc-shot-ph" id="svc-modal-ph"></span>
      </div>
      <div class="lap-base" aria-hidden="true"></div>
      <figcaption class="lap-cap">
        <span id="svc-modal-cap"></span>
        <a class="lap-open" id="svc-modal-open" target="_blank" rel="noopener" hidden>Open it full size <span aria-hidden="true">&rarr;</span></a>
      </figcaption>
    </figure>
    <div class="svc-modal-body" id="svc-modal-body"></div>
    <form method="dialog">
      <button class="cta" value="close">Close</button>
    </form>
  </dialog>
